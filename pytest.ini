[pytest]
testpaths = unit integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath =
    .
    ../backend/datingapp
    ../backend/datingapp/core
# Do NOT set DJANGO_SETTINGS_MODULE here — pytest-django (if installed in backend venv)
# would force django.setup() for integration tests too. Unit suite configures Django
# lazily in unit/conftest.py via django_ready.
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:django
markers =
    unit: pure / Django unit tests
    integration: live HTTP API tests (needs running backend)
    load: load-related smoke checks
    slow: slower tests
    django_db: needs database (pytest-django)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestConfigWarning
# Integration tests do NOT need Django — they speak HTTP only.
